name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Python and JSON
        run: |
          python3 -m compileall -q custom_components/vcx_knob
          python3 -m json.tool custom_components/vcx_knob/manifest.json >/dev/null
          python3 -m json.tool custom_components/vcx_knob/strings.json >/dev/null
          python3 -m json.tool custom_components/vcx_knob/translations/en.json >/dev/null
          python3 -m json.tool custom_components/vcx_knob/translations/cs.json >/dev/null

      - name: Build HACS release archive
        # HACS extracts zip_release directly into /config/custom_components/vcx_knob.
        # Files therefore MUST be at the ZIP root.
        run: |
          cd custom_components/vcx_knob
          zip -r ../../vcx_knob.zip .

      - name: Verify release archive layout
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("vcx_knob.zip") as z:
              names = set(z.namelist())
              assert "manifest.json" in names, "manifest.json must be at ZIP root"
              assert "__init__.py" in names, "__init__.py must be at ZIP root"
              assert not any(n.startswith("vcx_knob/") for n in names), "nested vcx_knob/ directory is invalid"
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vcx_knob.zip --verify-tag --generate-notes
